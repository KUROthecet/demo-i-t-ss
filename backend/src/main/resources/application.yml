spring:
  application:
    name: aims-backend

  datasource:
    url: jdbc:postgresql://localhost:5435/aims_db?reWriteBatchedInserts=true
    username: aims_user
    password: aims_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: AIMSShopSecretKeyForJWTTokenGeneration2026MustBe256BitsLong!
    expiration-ms: 86400000
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  manager:
    email: ${MANAGER_EMAIL:manager@aims.vn}

logging:
  level:
    com.aims: INFO
    org.springframework.security: WARN
    org.springframework.mail: DEBUG

