spring:
  application:
    name: aims-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/aims_db?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:aims_user}
    password: ${DB_PASSWORD:aims_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  manager:
    email: ${MANAGER_EMAIL:manager@aims.vn}
  admin:
    password: ${ADMIN_PASSWORD:admin123}
  manager-account:
    password: ${MANAGER_PASSWORD:manager123}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:aims.noreply@gmail.com}
    api-token: ${MAILTRAP_API_TOKEN:}
    inbox-id: ${MAILTRAP_INBOX_ID:}
  shipping:
    tier1-provinces:
      - "hanoi"
      - "ha noi"
      - "hà nội"
      - "ho chi minh"
      - "hồ chí minh"
      - "hcm"
      - "hn"
      - "tp.hcm"
      - "tp hcm"

logging:
  level:
    com.aims: INFO
    org.springframework.security: WARN

paypal:
  client:
    id: ${PAYPAL_CLIENT_ID}
    secret: ${PAYPAL_CLIENT_SECRET}
  api:
    url: https://api-m.sandbox.paypal.com
  vnd-to-usd-rate: 25000

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}
