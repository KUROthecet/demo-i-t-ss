services:

  db:
    image: postgres:15-alpine
    container_name: aims_postgres
    environment:
      POSTGRES_USER:     ${DB_USERNAME:-aims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aims_password}
      POSTGRES_DB:       ${DB_NAME:-aims_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aims_user} -d ${DB_NAME:-aims_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aims_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
